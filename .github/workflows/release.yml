# Push a tag like v0.1.0 to build and publish a release:
#   shiftdrop-x86_64-linux.tar.gz   what install.sh downloads
#   shiftdrop_amd64.deb             sudo apt install ./shiftdrop_amd64.deb
#   shiftdrop@jayhemnani.zip        the extension, for extensions.gnome.org
#   ShiftDrop-Setup-x64.exe         Windows installer (added by the windows job)
# Asset names stay the same every release, so releases/latest/download/<name> always works.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # 24.04's glibc (2.39) and GTK (4.14) are older than any system with the GNOME 49+ ShiftDrop needs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked --test plans

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
          cp target/debian/shiftdrop_*_amd64.deb shiftdrop_amd64.deb
          mkdir -p dist/shiftdrop
          cp -r target/release/shiftdrop README.md extension dist/shiftdrop/
          tar -czf shiftdrop-x86_64-linux.tar.gz -C dist shiftdrop
          (cd extension/shiftdrop@jayhemnani && zip -r "$GITHUB_WORKSPACE/shiftdrop@jayhemnani.zip" .)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "ShiftDrop $GITHUB_REF_NAME" --generate-notes \
            shiftdrop-x86_64-linux.tar.gz shiftdrop_amd64.deb shiftdrop@jayhemnani.zip

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked --test plans

      - name: Build
        run: cargo build --locked --release

      - name: Installer
        run: pwsh packaging/windows/build-installer.ps1 -Version ("$env:GITHUB_REF_NAME".TrimStart('v'))

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" target/ShiftDrop-Setup-x64.exe
